[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ckd"
version = "0.1.0"
description = "Chronic Kidney Disease classification project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ckd", "ckd.data", "ckd.features", "ckd.models", "ckd.visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
