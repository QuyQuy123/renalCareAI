spring.application.name=renalCareAI

# Server
server.port=${PORT:8080}

# MySQL database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/RenalCareAI?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# File upload for medical records
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
app.medical-records.storage-directory=${MEDICAL_RECORD_STORAGE_DIRECTORY:uploads/medical-records}

# Frontend origins allowed to call the API
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# RAG chatbox service. Backend starts this process locally and proxies /api/chat to it.
app.rag.autostart=${APP_RAG_AUTOSTART:true}
app.rag.working-directory=${APP_RAG_WORKING_DIRECTORY:../chatbox-rag}
app.rag.command=${APP_RAG_COMMAND:../chatbox-rag/.venv/Scripts/python.exe,-m,app.start}
app.rag.base-url=${APP_RAG_BASE_URL:http://127.0.0.1:8001}
